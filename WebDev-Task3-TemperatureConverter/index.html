
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">

        <header class="header">
            <div class="logo">
                <span class="logo-icon">🌡️</span>
                <span>TempConvert</span>
            </div>

            <button id="themeToggle" class="theme-btn"
                    aria-label="Toggle theme">
                🌙
            </button>
        </header>

        <section class="converter-section">

            <div class="intro">
                <span class="tag">SMART TEMPERATURE TOOL</span>

                <h1>Temperature Converter</h1>

                <p>
                    Convert temperatures between Celsius,
                    Fahrenheit and Kelvin instantly.
                </p>
            </div>

            <div class="converter-card">

                <form id="converterForm" novalidate>

                    <label for="temperature">
                        Enter Temperature
                    </label>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="Enter temperature value"
                        step="any"
                        inputmode="decimal"
                    >

                    <div id="errorMessage"
                         class="error-message"
                         role="alert"></div>

                    <label for="unit">
                        Convert From
                    </label>

                    <select id="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>

                    <button type="submit" class="convert-btn">
                        Convert Temperature
                        <span>→</span>
                    </button>

                    <button type="button" id="resetBtn"
                            class="reset-btn">
                        Reset
                    </button>

                </form>

                <section class="results" id="results"
                         aria-live="polite" hidden>

                    <div class="result-heading">
                        <h2>Conversion Results</h2>
                        <p>Your converted temperatures</p>
                    </div>

                    <div class="result-grid">

                        <div class="result-item">
                            <span>🌡️ Celsius</span>
                            <h3 id="celsiusResult">--</h3>
                            <small>°C</small>
                        </div>

                        <div class="result-item">
                            <span>🔥 Fahrenheit</span>
                            <h3 id="fahrenheitResult">--</h3>
                            <small>°F</small>
                        </div>

                        <div class="result-item">
                            <span>❄️ Kelvin</span>
                            <h3 id="kelvinResult">--</h3>
                            <small>K</small>
                        </div>

                    </div>
                </section>

            </div>

            <footer>
                <p>© 2026 TempConvert. Built with HTML, CSS & JavaScript.</p>
            </footer>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
